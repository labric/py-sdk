name: Release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Check tag matches package version
        run: |
          version=$(uv version --short)
          if [ "v$version" != "${{ github.ref_name }}" ]; then
            echo "Tag ${{ github.ref_name }} does not match pyproject version $version"
            exit 1
          fi

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        id: publish
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@release/v1

      # Sigstore and PyPI sometimes return transient 5xx errors. The publish
      # action refuses to run when attestations from a failed attempt remain,
      # and skip-existing covers a file the first attempt already uploaded.
      - name: Prepare to retry the publish
        if: steps.publish.outcome == 'failure'
        run: |
          rm -f dist/*.publish.attestation
          sleep 60

      - name: Retry publishing to PyPI
        if: steps.publish.outcome == 'failure'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes \
            --notes "https://pypi.org/project/labric/${GITHUB_REF_NAME#v}/"
